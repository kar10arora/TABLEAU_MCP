[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tableau-mcp-kartik"
version = "1.0.3"
description = "Model Context Protocol server for automated Tableau workbook generation"
readme = "README_PYPI.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Kartik Arora", email = "arorakartik1007@gmail.com"}
]
keywords = ["tableau", "mcp", "model-context-protocol", "llm", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=2.0.0,<3.0.0",
    "pandas>=2.0.0",
    "lxml>=4.9.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
]

[project.scripts]
tableau-mcp = "tableau_mcp.__main__:main"
tableau-mcp-setup = "tableau_mcp.setup_helper:print_config"

[project.urls]
Homepage = "https://github.com/kar10arora/TABLEAU_MCP"
Repository = "https://github.com/kar10arora/TABLEAU_MCP"

[tool.setuptools.packages.find]
where = ["."]
include = ["tableau_mcp*"]

[tool.setuptools.package-data]
"tableau_mcp" = ["templates/*.twb"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
